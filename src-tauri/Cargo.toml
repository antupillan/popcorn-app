[package]
name = "popcorn-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "popcorn_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# Primer plugin nuevo desde el setup inicial (ver Mandato de sincronización
# de empaquetado) — selector nativo de carpeta para la biblioteca Local.
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
librqbit = "8.1.1"
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
axum = "0.8"
tokio-util = { version = "0.7", features = ["io"] }
regex = "1"
urlencoding = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
anyhow = "1"
# Pinned to 0.39: 0.40 pulls libsqlite3-sys 0.38, whose build.rs uses the
# unstable `cfg_select!` macro and fails on rustc 1.91 (stable). Bump once
# the toolchain here is upgraded past whatever release stabilizes it.
rusqlite = { version = "=0.39.0", features = ["bundled"] }
# Media playlists HLS (segmentos, no la lista de canales — esa se parsea a
# mano en iptv/parse.rs igual que indexers/parse.rs). Pure-Rust, sin binario
# nativo. Verificado en crates.io antes de fijar versión: activamente
# mantenido (última publicación 2026-07-30), 1.4M+ descargas.
m3u8-rs = "6.0.1"

