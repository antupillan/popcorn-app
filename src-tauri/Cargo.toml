[package]
name = "popcorn-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["Samuel Paredes"]
edition = "2021"
license = "AGPL-3.0-or-later"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "popcorn_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# Primer plugin nuevo desde el setup inicial (ver Mandato de sincronización
# de empaquetado) — selector nativo de carpeta para la biblioteca Local.
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
librqbit = "8.1.1"
# Ya resuelta como dependencia transitiva de librqbit (ver Cargo.lock) —
# se suma directa solo para parsear metadata de .torrent (torrent_metainfo)
# al preparar sembrado real de archive.org, cero riesgo nuevo de árbol.
librqbit-core = "5.0.0"
# Tipo ByteBufOwned que pide torrent_metainfo::torrent_from_bytes — mismo
# criterio que librqbit-core arriba (ya resuelta, solo se hace directa).
buffers = { package = "librqbit-buffers", version = "4.2.0" }
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
axum = "0.8"
# CORS permisivo para el server de streaming local (127.0.0.1 solo, sin
# auth ni cookies — hls.js hace fetch/XHR para segmentos, a diferencia de
# <video src> que no está sujeto a CORS; sin esto, hls.js falla con
# fragLoadError contra nuestro propio /local, confirmado en vivo).
tower-http = { version = "0.6", features = ["cors"] }
tokio-util = { version = "0.7", features = ["io"] }
regex = "1"
urlencoding = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
# "sync" agregado para tokio::sync::Semaphore (ver availability_ping.rs,
# acota la concurrencia del ping de disponibilidad de curación).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
anyhow = "1"
# Pinned to 0.39: 0.40 pulls libsqlite3-sys 0.38, whose build.rs uses the
# unstable `cfg_select!` macro and fails on rustc 1.91 (stable). Bump once
# the toolchain here is upgraded past whatever release stabilizes it.
rusqlite = { version = "=0.39.0", features = ["bundled"] }
# Media playlists HLS (segmentos, no la lista de canales — esa se parsea a
# mano en iptv/parse.rs igual que indexers/parse.rs). Pure-Rust, sin binario
# nativo. Verificado en crates.io antes de fijar versión: activamente
# mantenido (última publicación 2026-07-30), 1.4M+ descargas.
m3u8-rs = "6.0.1"
# Remux MKV->MP4 sin recodificar, para reproducir en WebViews que no
# soportan Matroska nativamente (WebKitGTK confirmado en vivo esta
# sesión — MEDIA_ERR_SRC_NOT_SUPPORTED pese a que el sistema sí puede
# decodificar el mismo stream por otra vía). Pure-Rust, sin binario
# externo (ffmpeg descartado a propósito, ver plan — Mandato de un solo
# binario). Ambas verificadas en crates.io antes de fijar versión.
# matroska-demuxer: activamente mantenido, 120K+ descargas.
matroska-demuxer = "0.8.1"
# mp4: muy establecida, 11.9M+ descargas.
mp4 = "0.14.0"
# Cliente para la Web API de qBittorrent (ExternalQbittorrent, ver plan
# "motor_externo_qbittorrent"). Verificado en crates.io antes de fijar
# versión: activamente mantenido, 1.6M+ descargas — mucho más maduro que
# la alternativa evaluada (transmission-rpc, ~53K descargas), motivo por
# el que qBittorrent se eligió como primer motor externo.
qbit-rs = "0.6.0"
# Requerido para construir el tipo `Url` que pide qbit-rs al agregar un
# torrent por magnet/URL (`TorrentSource::Urls`) — ya es dependencia
# transitiva de reqwest, se suma directa por el mismo criterio que
# librqbit-core/buffers arriba.
url = "2"

# Solo Linux: el acento de color viene del portal freedesktop
# (org.freedesktop.portal.Settings), que no existe en Windows/macOS — así
# no infla esos builds. Verificado en crates.io antes de fijar versión:
# activamente mantenido (última publicación 2026-07-17), 12M+ descargas.
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", features = ["settings"] }

[dev-dependencies]
# Solo para construir fixtures de .torrent reales en tests (armar la
# estructura con los structs reales de librqbit-core y serializarla, en
# vez de escribir bencode a mano — evita errores de conteo de bytes).
bencode = { package = "librqbit-bencode", version = "3.1.0" }
# Servidor HTTP mock para tests de availability_ping.rs (ping_ok/ping_many)
# sin red real. Verificado en crates.io antes de fijar versión: activamente
# mantenido (última publicación 2026-02-02), 52M+ descargas.
mockito = "1.7.2"

